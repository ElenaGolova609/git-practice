name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python version
        run: python --version

      - name: Show first lines of Python files
        run: |
          echo "=== First lines of main.py ==="
          head -n 5 main.py || echo "File main.py not found"
          echo "=== First lines of test_sample.py ==="
          head -n 5 test_sample.py || echo "File test_sample.py not found"

      - name: Test Python syntax (compile check)
        run: |
          python -m py_compile main.py 2>&1 || echo "Warning: main.py has syntax issues (continuing)"
          python -m py_compile test_sample.py 2>&1 || echo "Warning: test_sample.py has syntax issues (continuing)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run linter
        run: flake8 . --show-source --statistics
